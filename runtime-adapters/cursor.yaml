{
  "schema_version": "1.0.0",
  "id": "cursor",
  "runtime_id": "cursor",
  "name": "Cursor",
  "description": "Cursor consumes the shared root AGENTS.md (M4-derived) for repository instructions (Cursor supports AGENTS.md); .cursor/rules/ MDC rule files are optional and not generated by M5.",
  "instruction_format": "agents-md",
  "instruction_source": {
    "path": "AGENTS.md",
    "ownership": "shared"
  },
  "config": [],
  "render": {
    "outputs": []
  },
  "install": {
    "paths": []
  },
  "uninstall": {
    "owned_files": [],
    "owned_dirs": []
  },
  "permission_policy": {
    "modifies_global_config": false,
    "requires_explicit_consent": true,
    "dangerous_flags_never_enabled": [
      "--dangerously-skip-permissions",
      "--dangerously-bypass-approvals-and-sandbox",
      "--yolo"
    ]
  },
  "limitations": [
    "GUI desktop IDE; CLI support limited",
    "MDC frontmatter required for .cursor/rules",
    "Subagent and hook support not documented",
    "Project instructions are read from the shared root AGENTS.md"
  ],
  "detection": {
    "executables": [],
    "config_files": [
      ".cursor/",
      ".cursor/rules/*.mdc",
      "AGENTS.md"
    ],
    "environment_variables": []
  }
}
