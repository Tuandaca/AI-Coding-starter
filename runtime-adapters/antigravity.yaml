{
  "schema_version": "1.0.0",
  "id": "antigravity",
  "runtime_id": "antigravity",
  "name": "Antigravity IDE",
  "description": "Antigravity uses its own .agent/GEMINI.md instruction file (Antigravity-specific, not the shared M4 AGENTS.md). This adapter owns .agent/GEMINI.md.",
  "instruction_format": "gemini-md",
  "instruction_source": {
    "path": ".agent/GEMINI.md",
    "ownership": "owned"
  },
  "config": [],
  "render": {
    "outputs": [
      {
        "path": ".agent/GEMINI.md",
        "template": [
          "# {project.name}",
          "",
          "Project ID: {project.id}",
          "Description: {project.description}",
          "Project Type: {project.project_type}",
          "Stack Bundle: {project.stack_bundle}",
          "Capabilities: {project.capabilities_joined}",
          "",
          "## Workflow State",
          "Phase: {state.phase}",
          "Focus: {state.focus}",
          "",
          "{state.active_tasks_bullets}",
          "",
          "---",
          "> Derived from canonical state: .ai-coding-starter/project.yaml",
          "> Generated by ai-coding-starter runtime adapter: {runtime.id} ({runtime.instruction_format})",
          "> Reversible and non-authoritative; canonical project.yaml wins on conflict.",
          ""
        ],
        "mark_owned": true
      }
    ],
    "agents": {
      "path_template": ".agent/skills/{slug}/SKILL.md",
      "content_template": [
        "---",
        "name: {slug}",
        "description: {description}",
        "---",
        "{body}"
      ],
      "mark_owned": true
    }
  },
  "install": {
    "paths": [
      ".agent/"
    ]
  },
  "uninstall": {
    "owned_files": [
      ".agent/GEMINI.md"
    ],
    "owned_dirs": [
      ".agent/"
    ]
  },
  "permission_policy": {
    "modifies_global_config": false,
    "requires_explicit_consent": true,
    "dangerous_flags_never_enabled": [
      "--dangerously-skip-permissions",
      "--dangerously-bypass-approvals-and-sandbox",
      "--yolo"
    ]
  },
  "limitations": [
    "No MCP support",
    "Gemini-centric instruction format",
    "No subagent delegation"
  ],
  "detection": {
    "executables": [],
    "config_files": [
      ".agent/GEMINI.md",
      ".agent/agents/*.md",
      ".agent/skills/*/skill.md"
    ],
    "environment_variables": []
  }
}
