{
  "schema_version": "1.0.0",
  "id": "claude-code",
  "runtime_id": "claude-code",
  "name": "Claude Code",
  "description": "Claude Code consumes the shared root AGENTS.md (M4-derived) for repository instructions (Claude Code reads AGENTS.md in place of CLAUDE.md); .claude/ holds project settings, hooks, and agents and is not written by M5.",
  "instruction_format": "agents-md",
  "instruction_source": {
    "path": "AGENTS.md",
    "ownership": "shared"
  },
  "config": [
    ".claude/settings.json"
  ],
  "render": {
    "outputs": []
  },
  "install": {
    "paths": []
  },
  "uninstall": {
    "owned_files": [],
    "owned_dirs": []
  },
  "permission_policy": {
    "modifies_global_config": false,
    "requires_explicit_consent": true,
    "dangerous_flags_never_enabled": [
      "--dangerously-skip-permissions",
      "--dangerously-bypass-approvals-and-sandbox",
      "--yolo"
    ]
  },
  "limitations": [
    "Project instructions are read from the shared root AGENTS.md or a root CLAUDE.md; .claude/CLAUDE.md is not the primary discovery location",
    "Custom settings.json schema"
  ],
  "detection": {
    "executables": [
      "claude"
    ],
    "config_files": [
      "AGENTS.md",
      "CLAUDE.md",
      ".claude/settings.json"
    ],
    "environment_variables": [
      "CLAUDE_CONFIG_DIR",
      "ANTHROPIC_API_KEY"
    ]
  }
}
