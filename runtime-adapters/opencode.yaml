{
  "schema_version": "1.0.0",
  "id": "opencode",
  "runtime_id": "opencode",
  "name": "OpenCode",
  "description": "OpenCode consumes the shared root AGENTS.md (M4-derived) for repository instructions; .opencode/opencode.json or .opencode/opencode.jsonc is project-local OpenCode configuration and is not written by M5. The archived opencode-ai/opencode repository is historical only.",
  "instruction_format": "agents-md",
  "instruction_source": {
    "path": "AGENTS.md",
    "ownership": "shared"
  },
  "config": [
    ".opencode/opencode.json",
    ".opencode/opencode.jsonc"
  ],
  "render": {
    "outputs": [],
    "agents": {
      "path_template": ".opencode/agents/{slug}.md",
      "content_template": [
        "---",
        "name: {name}",
        "description: {description}",
        "mode: subagent",
        "division: {division}",
        "---",
        "{body}"
      ],
      "mark_owned": true
    }
  },
  "install": {
    "paths": []
  },
  "uninstall": {
    "owned_files": [],
    "owned_dirs": []
  },
  "permission_policy": {
    "modifies_global_config": false,
    "requires_explicit_consent": true,
    "dangerous_flags_never_enabled": [
      "--dangerously-skip-permissions",
      "--dangerously-bypass-approvals-and-sandbox",
      "--yolo"
    ]
  },
  "limitations": [
    "Project instructions are read from the shared root AGENTS.md; OpenCode does not require a separate OpenCode.md memory file",
    "Hook support is via plugins and is preliminary"
  ],
  "detection": {
    "executables": [
      "opencode"
    ],
    "config_files": [
      ".opencode/opencode.json",
      ".opencode/opencode.jsonc",
      "AGENTS.md"
    ],
    "environment_variables": []
  }
}
