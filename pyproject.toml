[project]
name = "ai-coding-starter"
version = "2.1.1"
description = "AI Coding Starter - scaffolding and resource management for AI-assisted development"
requires-python = ">=3.11"

dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "scripts"]
