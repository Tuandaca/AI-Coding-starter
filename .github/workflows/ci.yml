name: CI

on:
  push:
    branches: [master, feat/final-resource-hardening, feat/v2.1-agency-integration]
  pull_request:
    branches: [master, feat/final-resource-hardening]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python --version

      - name: Run compileall (stdlib byte-compile, offline)
        run: python -m compileall -q core tests scripts new_project.py analytics.py migrate_project.py

      - name: Run full unittest suite (offline, stdlib only)
        run: python -m unittest discover -s tests -t .

      - name: Repository consistency and security checks
        run: python scripts/ci_consistency_check.py
