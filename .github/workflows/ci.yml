name: CI

on:
  push:
    branches: [master, feat/v2.1-agency-integration]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Compile production Python sources
        run: |
          python -c "
import py_compile, pathlib
files = list(pathlib.Path('.').rglob('*.py'))
[py_compile.compile(str(f), doraise=True) for f in files]
print(f'COMPILED {len(files)} files OK')
        shell: bash

      - name: Run test suite
        run: |
          python -m unittest discover -s tests -t .
        shell: bash
