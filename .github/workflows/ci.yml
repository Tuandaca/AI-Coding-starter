name: CI

on:
  push:
    branches: [master, feat/final-resource-hardening, feat/v2.1-agency-integration, fix/v2.2.1-final-stabilization]
  pull_request:
    branches: [master, feat/final-resource-hardening]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: pip install -e .

      - name: Run compileall (stdlib byte-compile, offline)
        run: python -m compileall -q core tests scripts new_project.py analytics.py migrate_project.py

      - name: Run full unittest suite
        run: python -m unittest discover -s tests -t .

      - name: Repository consistency and security checks
        run: python scripts/ci_consistency_check.py

      - name: Run runtime isolation tests
        run: python -m unittest tests.test_runtime_isolation -v

      - name: Run runtime switching tests
        run: python -m unittest tests.test_runtime_switching -v

      - name: Run path escape tests
        run: python -m unittest tests.test_runtime_path_escape -v

  scaffolds:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -e .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate all canonical FULL scaffolds
        run: python scripts/ci_validate_scaffolds.py

  scaffolds-windows:
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -e .

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate .NET scaffold on Windows
        run: python scripts/ci_validate_scaffolds.py --bundle dotnet-postgres
