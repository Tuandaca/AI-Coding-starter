name: Full Scaffold Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  validate-scaffolds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -e .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate all canonical FULL scaffolds
        run: python scripts/ci_validate_scaffolds.py
